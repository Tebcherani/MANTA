services:
  odyssey_1:
    image: odyssey_sim_dev

    environment:
      ROS_DOMAIN_ID: 1

      ODYSSEY_VEHICLE_ID: odyssey_1
      ODYSSEY_MISSION_FILE: dive240.mi

      ODYSSEY_DATA_DIR: /odyssey/output/Data
      ODYSSEY_FAULT_DIR: /odyssey/assets/Faults
      ODYSSEY_MISSION_DIR: /odyssey/assets/Missions
      VEHICLE_PATH: /odyssey/assets/Vehicles/Borealis.vd
      SIM_LOG_PATH: /odyssey/output/Logs/odyssey_1.log

    volumes:
      - type: bind
        source: .
        target: /odyssey

    command:
      - /bin/bash
      - -lc
      - |
        source /opt/ros/jazzy/setup.bash
        source /odyssey/ros_ws/install/setup.bash
        ros2 run odyssey_sim odyssey_node


  odyssey_2:
    image: odyssey_sim_dev

    environment:
      ROS_DOMAIN_ID: 1

      ODYSSEY_VEHICLE_ID: odyssey_2
      ODYSSEY_MISSION_FILE: dive240_diff.mi

      ODYSSEY_DATA_DIR: /odyssey/output/Data
      ODYSSEY_FAULT_DIR: /odyssey/assets/Faults
      ODYSSEY_MISSION_DIR: /odyssey/assets/Missions
      VEHICLE_PATH: /odyssey/assets/Vehicles/Borealis.vd
      SIM_LOG_PATH: /odyssey/output/Logs/odyssey_2.log

    volumes:
      - type: bind
        source: .
        target: /odyssey

    command:
      - /bin/bash
      - -lc
      - |
        source /opt/ros/jazzy/setup.bash
        source /odyssey/ros_ws/install/setup.bash
        ros2 run odyssey_sim odyssey_node


  sim_orchestrator:
    image: odyssey_sim_dev

    environment:
      ROS_DOMAIN_ID: 1

    volumes:
      - type: bind
        source: .
        target: /odyssey

    command:
      - /bin/bash
      - -lc
      - |
        source /opt/ros/jazzy/setup.bash
        source /odyssey/ros_ws/install/setup.bash
        ros2 run sim_orchestrator sim_orchestrator_node