[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manta-review"
version = "0.1.0"
description = "Review and compare MANTA vehicle simulation results"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "xarray>=2022.3",
    "matplotlib>=3.5",
    "PyQt5>=5.15",
]

[project.optional-dependencies]
seawater = ["gsw>=3.4"]

[project.scripts]
manta-review = "manta_review.review2:main"

[tool.setuptools]
packages = ["manta_review"]