# Kinematic Simulator Configuration
# Tunable parameters for ksim (steady-state algebraic motion model)
# Uncomment and edit values to override defaults

# Physical parameters
rho                    1025.0    # water density (kg/m^3)
mass                   100.0     # vehicle mass (kg)
volume                 0.098     # displaced volume (m^3)
cg_cb_offset           0.001     # CG to CB offset (m), positive if CB above CG

# Pitch control (from hydrodynamic coefficients)
ref_area               0.05      # planform reference area (m^2)
ref_length             0.5       # reference chord length (m)
Cm_theta              -0.5       # pitching moment coeff vs pitch (nondimensional)
Cm_delta               0.3       # pitching moment coeff vs elevator (nondim/rad)
CL_theta               2.0       # vertical force coeff vs pitch (nondim/rad)
vertical_drag_coeff    50.0      # vertical drag coefficient (N·s/m)

# Yaw control (rudder)
K_rudder               0.2       # rudder yaw-rate gain (rad/s per rad per m/s)
D_rudder               0.1       # rudder yaw damping (s^-1)
tau_rudder             0.5       # rudder dynamics time constant (s)

# Speed control
tau_speed              2.0       # speed response time constant (s)
max_speed              2.5       # maximum speed (m/s)

# Pitch dynamics
tau_pitch              1.0       # pitch response time constant (s)
max_pitch              0.436     # max pitch angle (rad, ~25 degrees)

# Heading control
max_yaw_rate           0.5       # max yaw rate (rad/s)
K_hdg_turn             0.5       # heading setpoint controller gain (rad/s per rad)

# Depth to pitch mapping (used when depth_mode==1)
K_depth_to_pitch       0.02      # depth error to pitch gain (rad/m)

# Drop weights (affects buoyancy)
drop_weight_1_mass     0.5       # drop weight 1 mass (kg)
drop_weight_2_mass     0.5       # drop weight 2 mass (kg)
