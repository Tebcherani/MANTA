#--------------------------------------------------
# Verion
#--------------------------------------------------
version: 1


#--------------------------------------------------
# Output directories
#--------------------------------------------------
output:
  data_directory: ./output/picket_line/Data
  log_directory: ./output/picket_line/Logs
  auv_sample_period: 5.0    # Sample AUV's state every X simulated seconds
  whale_sample_period: 60.0 # Sample whale state every X simulated seconds


#--------------------------------------------------
# Simulation parameters
#--------------------------------------------------
simulation:
  timestep: 0.02      # Each simulation step advances time by X seconds
  control_period: 10  # Sensor processing and vehicle control run once every X simulation steps
  max_steps: 12960000 
  steps_per_message: 10000


#--------------------------------------------------
# Analysis
#--------------------------------------------------
monte_carlo:
  min_realizations: 100
  max_realizations: 500
  batch_size: 25
  workers: 8

  realization_timeout: 60
  max_retries: 1
  recovery_cycles: 3

  confidence_level: 0.95
  target_half_width: 0.03
  stability_tolerance: 0.01
  random_seed: 42

sweep:
  min_vehicles: 1
  max_vehicles: 13


#--------------------------------------------------
# Mission
#--------------------------------------------------
scenario:
  type: picket_line

  duration: 259200.0  # 3 days

  picket_line:
    start:
      north: 0.0
      east: -63000.0
    end:
      north: 0.0
      east: 63000.0

  patrol:
    speed: 0.25
    depth: 50.0
    capture: 5.0

  detection:
    radius: 11000.0 # meters

  whales:
    count: 46
    active_entire_mission: false
    start_distance: 25000.0
    depth: 20.0

    movement:
      speed_mean: 1.5
      speed_std: 0.2
      turn_interval: 60.0
      heading_correlation: 0.95
      heading_std_degrees: 15.0

    grouping:
      mean_group_size: 3.0
      position_std: 1000.0
      start_time_std: 600.0
      shared_heading_fraction: 0.75
    
    # Reference paper: https://academic.oup.com/icesjms/article/82/4/fsad174/7341838
    calling:
      bouts:
        # Mean observed upcalling-bout duration across the three full-year
        # monitoring sites: 30.7 min × 60 s/min = 1,842 s.
        mean_duration: 1842.0

        # Approximate mean silent time between bouts, derived from 3,847 bouts
        # observed over 432 acoustically positive recorder-days. The resulting
        # 2.70 h mean active-silent cycle minus the 30.7 min mean bout duration
        # gives approximately 2.18 h, or 7,860 s, of silence.
        mean_silent_duration: 7860.0

        # Aggregate active-bout rate derived from 79,032 confirmed upcalls across
        # 3,847 bouts: 20.54 calls per bout divided by the 30.7 min mean bout
        # duration gives approximately 40.1 calls/h. This is a recorder-level
        # population rate, not an independent rate for each group or whale.
        active_call_rate_per_hour: 40.1


#--------------------------------------------------
# Vehicles
#--------------------------------------------------
vehicles:
  - id: auv_1
    type: odyssey
    mission: ./vehicles/odyssey/missions/picket_line/auv_1.mi
    model: ./vehicles/odyssey/config/Borealis.vd
    fault: ""

  - id: auv_2
    type: odyssey
    mission: ./vehicles/odyssey/missions/picket_line/auv_2.mi
    model: ./vehicles/odyssey/config/Borealis.vd
    fault: ""
  
  - id: auv_3
    type: odyssey
    mission: ./vehicles/odyssey/missions/picket_line/auv_3.mi
    model: ./vehicles/odyssey/config/Borealis.vd
    fault: ""
  
  - id: auv_4
    type: odyssey
    mission: ./vehicles/odyssey/missions/picket_line/auv_4.mi
    model: ./vehicles/odyssey/config/Borealis.vd
    fault: ""