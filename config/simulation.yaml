#--------------------------------------------------
# Verion
#--------------------------------------------------
version: 1

#--------------------------------------------------
# Simulation parameters
#--------------------------------------------------
simulation:
  timestep: 0.02
  control_period: 10
  max_cycles: 1000000

#--------------------------------------------------
# Output directories
#--------------------------------------------------
output:
  data_directory: ./output/Data
  log_directory: ./output/Logs

#--------------------------------------------------
# Mission
#--------------------------------------------------
scenario:
  type: picket_line

  duration: 604800.0 # one week, seconds

  picket_line:
    start:
      north: 0.0
      east: -63000.0
    end:
      north: 0.0
      east: 63000.0

  patrol:
    speed: 1.5 # varied during fleet-size analysis
    depth: 50.0

  detection:
    radius: 11000.0 # meters

  whales:
    count: 46
    speed: 1.5        # meters per second
    call_rate: 6.4    # calls per hour
    start_distance: 11000.0

  monte_carlo:
    realizations: 500
    time_samples: 500
    random_seed: 42

#--------------------------------------------------
# Vehicles
#--------------------------------------------------
vehicles:
  - id: odyssey_1
    type: odyssey
    mission: ./missions/dive240/dive240.mi
    model: ./config/vehicles/Borealis.vd
    fault: ""

  - id: odyssey_2
    type: odyssey
    mission: ./missions/dive240/dive240_diff.mi
    model: ./config/vehicles/Borealis.vd
    fault: ""

