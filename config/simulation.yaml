#--------------------------------------------------
# Verion
#--------------------------------------------------
version: 1

#--------------------------------------------------
# Simulation parameters
#--------------------------------------------------
simulation:
  timestep: 0.02
  control_period: 10
  max_cycles: 12960000  
  steps_per_message: 10000

#--------------------------------------------------
# Output directories
#--------------------------------------------------
output:
  data_directory: ./output/Data
  log_directory: ./output/Logs
  auv_sample_period: 5.0
  whale_sample_period: 60.0

#--------------------------------------------------
# Mission
#--------------------------------------------------
scenario:
  type: picket_line

  duration: 259200.0  # 3 days

  picket_line:
    start:
      north: 0.0
      east: -63000.0
    end:
      north: 0.0
      east: 63000.0

  patrol:
    speed: 5.0 # varied during fleet-size analysis
    depth: 50.0
    capture: 5.0

  detection:
    radius: 11000.0 # meters

  whales:
    count: 46
    speed: 1.5
    call_rate: 6.4
    start_distance: 11000.0
    depth: 20.0

    movement:
      turn_interval: 60.0
      heading_correlation: 0.95
      heading_std_degrees: 15.0

  monte_carlo:
    min_realizations: 100
    max_realizations: 500
    batch_size: 25
    workers: 8

    realization_timeout: 60
    max_retries: 1
    recovery_cycles: 3

    confidence_level: 0.95
    target_half_width: 0.03
    stability_tolerance: 0.01
    random_seed: 42

    sweep:
      min_vehicles: 1
      max_vehicles: 10


#--------------------------------------------------
# Vehicles
#--------------------------------------------------
vehicles:
  - id: odyssey_1
    type: odyssey
    mission: ./generated/missions/picket_line_odyssey_1.mi
    model: ./config/vehicles/Borealis.vd
    fault: ""

vehicles:
  - id: odyssey_2
    type: odyssey
    mission: ./generated/missions/picket_line_odyssey_2.mi
    model: ./config/vehicles/Borealis.vd
    fault: ""
