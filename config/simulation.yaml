#--------------------------------------------------
# Verion
#--------------------------------------------------
version: 1

#--------------------------------------------------
# Simulation parameters
#--------------------------------------------------
simulation:
  timestep: 0.02
  control_period: 10
  max_cycles: 12960000  
  steps_per_message: 10000

#--------------------------------------------------
# Output directories
#--------------------------------------------------
output:
  data_directory: ./output/Data
  log_directory: ./output/Logs

#--------------------------------------------------
# Mission
#--------------------------------------------------
scenario:
  type: picket_line

  duration: 259200.0  # 3 days

  picket_line:
    start:
      north: 0.0
      east: -63000.0
    end:
      north: 0.0
      east: 63000.0

  patrol:
    speed: 1.5 # varied during fleet-size analysis
    depth: 50.0
    capture: 5.0

  detection:
    radius: 11000.0 # meters

  whales:
    count: 46
    speed: 1.5
    call_rate: 0.14 # 6.4 calls/h / 46 whales
    start_distance: 11000.0
    depth: 20.0

  monte_carlo:
    realizations: 500
    time_samples: 500
    random_seed: 42

#--------------------------------------------------
# Vehicles
#--------------------------------------------------
vehicles:
  - id: odyssey_1
    type: odyssey
    mission: ./generated/missions/picket_line_odyssey_1.mi
    model: ./config/vehicles/Borealis.vd
    fault: ""

  - id: odyssey_2
    type: odyssey
    mission: ./generated/missions/picket_line_odyssey_2.mi
    model: ./config/vehicles/Borealis.vd
    fault: ""

