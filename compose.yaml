services:
  simulator:
    build:
      context: .
      
    image: odyssey_sim

    command: ["dive240.mi"]

    environment: 
      ODYSSEY_DATA_DIR: /odyssey/output/Data
      ODYSSEY_FAULT_DIR: /odyssey/assets/Faults
      ODYSSEY_MISSION_DIR: /odyssey/assets/Missions
      ODYSSEY_LOG_PATH: /odyssey/output/Logs/odyssey.log
      SIM_LOG_PATH: /odyssey/output/Logs/simulation.log
      VEHICLE_PATH: /odyssey/assets/Vehicles/Borealis.vd

    user: "${HOST_UID}:${HOST_GID}"

    volumes:
      - type: bind
        source: ./output
        target: /odyssey/output
    
      - type: bind
        source: ./assets
        target: /odyssey/assets
        read_only: true

      - type: bind
        source: ./SEnvironment
        target: /odyssey/SEnvironment
        read_only: true