name: manta
services:
  auv_1:
    image: odyssey_sim_dev
    environment:
      ROS_DOMAIN_ID: '1'
      ODYSSEY_VEHICLE_ID: auv_1
      ODYSSEY_DATA_DIR: /odyssey/output/Data
      ROS_LOG_DIR: /odyssey/output/Logs
      SIM_LOG_PATH: /odyssey/output/Logs/auv_1.log
      MISSION_PATH: /odyssey/generated/missions/picket_line_auv_1.mi
      VEHICLE_PATH: /odyssey/config/vehicles/Borealis.vd
      FAULT_PATH: ''
    volumes:
    - type: bind
      source: /home/tanya/Documents/MANTA
      target: /odyssey
    command:
    - /bin/bash
    - -lc
    - 'source /opt/ros/jazzy/setup.bash

      source /odyssey/ros_ws/install/setup.bash

      ros2 run odyssey_sim odyssey_node --ros-args -p output_sample_period:=5.0'
  auv_2:
    image: odyssey_sim_dev
    environment:
      ROS_DOMAIN_ID: '1'
      ODYSSEY_VEHICLE_ID: auv_2
      ODYSSEY_DATA_DIR: /odyssey/output/Data
      ROS_LOG_DIR: /odyssey/output/Logs
      SIM_LOG_PATH: /odyssey/output/Logs/auv_2.log
      MISSION_PATH: /odyssey/generated/missions/picket_line_auv_2.mi
      VEHICLE_PATH: /odyssey/config/vehicles/Borealis.vd
      FAULT_PATH: ''
    volumes:
    - type: bind
      source: /home/tanya/Documents/MANTA
      target: /odyssey
    command:
    - /bin/bash
    - -lc
    - 'source /opt/ros/jazzy/setup.bash

      source /odyssey/ros_ws/install/setup.bash

      ros2 run odyssey_sim odyssey_node --ros-args -p output_sample_period:=5.0'
  auv_3:
    image: odyssey_sim_dev
    environment:
      ROS_DOMAIN_ID: '1'
      ODYSSEY_VEHICLE_ID: auv_3
      ODYSSEY_DATA_DIR: /odyssey/output/Data
      ROS_LOG_DIR: /odyssey/output/Logs
      SIM_LOG_PATH: /odyssey/output/Logs/auv_3.log
      MISSION_PATH: /odyssey/generated/missions/picket_line_auv_3.mi
      VEHICLE_PATH: /odyssey/config/vehicles/Borealis.vd
      FAULT_PATH: ''
    volumes:
    - type: bind
      source: /home/tanya/Documents/MANTA
      target: /odyssey
    command:
    - /bin/bash
    - -lc
    - 'source /opt/ros/jazzy/setup.bash

      source /odyssey/ros_ws/install/setup.bash

      ros2 run odyssey_sim odyssey_node --ros-args -p output_sample_period:=5.0'
  whale_sim:
    image: odyssey_sim_dev
    environment:
      ROS_DOMAIN_ID: '1'
      ROS_LOG_DIR: /odyssey/output/Logs
    volumes:
    - type: bind
      source: /home/tanya/Documents/MANTA
      target: /odyssey
    command:
    - /bin/bash
    - -lc
    - 'source /opt/ros/jazzy/setup.bash

      source /odyssey/ros_ws/install/setup.bash

      ros2 run whale_sim whale_node --ros-args -p "count:=46" -p "line_start_north:=0.0"
      -p "line_start_east:=-63000.0" -p "line_end_north:=0.0" -p "line_end_east:=63000.0"
      -p "speed_min:=1.0" -p "speed_max:=2.0" -p "start_distance:=11000.0" -p "depth:=20.0"
      -p "mission_duration:=259200.0" -p "call_rate_min:=4.8" -p "call_rate_max:=8.0"
      -p "call_activity_interval:=600.0" -p "call_activity_correlation:=0.9" -p "group_log_rate_std:=0.5"
      -p "turn_interval:=60.0" -p "heading_correlation:=0.95" -p "heading_std_degrees:=15.0"
      -p "group_mean_size:=3.0" -p "group_position_std:=1000.0" -p "group_start_time_std:=600.0"
      -p "shared_heading_fraction:=0.75" -p "data_directory:=/odyssey/output/Data"
      -p "random_seed:=42" -p "sample_period:=60.0"'
  whale_detection_sim:
    image: odyssey_sim_dev
    environment:
      ROS_DOMAIN_ID: '1'
      ROS_LOG_DIR: /odyssey/output/Logs
    volumes:
    - type: bind
      source: /home/tanya/Documents/MANTA
      target: /odyssey
    command:
    - /bin/bash
    - -lc
    - 'source /opt/ros/jazzy/setup.bash

      source /odyssey/ros_ws/install/setup.bash

      ros2 run whale_detection_sim whale_detection_node --ros-args -p "vehicle_ids:=[auv_1,
      auv_2, auv_3]" -p "detection_range:=11000.0" -p "data_directory:=/odyssey/output/Data"'
  sim_orchestrator:
    image: odyssey_sim_dev
    environment:
      ROS_DOMAIN_ID: '1'
      ROS_LOG_DIR: /odyssey/output/Logs
      SIM_LOG_PATH: /odyssey/output/Logs/sim_orchestrator.log
    volumes:
    - type: bind
      source: /home/tanya/Documents/MANTA
      target: /odyssey
    command:
    - /bin/bash
    - -lc
    - 'source /opt/ros/jazzy/setup.bash

      source /odyssey/ros_ws/install/setup.bash

      ros2 run sim_orchestrator sim_orchestrator_node --ros-args -p "vehicle_ids:=[auv_1,
      auv_2, auv_3]" -p "data_directory:=/odyssey/output/Data" -p "timestep:=0.02"
      -p "control_period:=10" -p "max_cycles:=12960000" -p "steps_per_message:=10000"'
