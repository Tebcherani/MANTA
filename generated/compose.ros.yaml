name: manta
services:
  odyssey_1:
    image: odyssey_sim_dev
    environment:
      ROS_DOMAIN_ID: '1'
      ODYSSEY_VEHICLE_ID: odyssey_1
      ODYSSEY_DATA_DIR: /odyssey/output/Data
      ROS_LOG_DIR: /odyssey/output/Logs
      SIM_LOG_PATH: /odyssey/output/Logs/odyssey_1.log
      MISSION_PATH: /odyssey/generated/missions/picket_line_odyssey_1.mi
      VEHICLE_PATH: /odyssey/config/vehicles/Borealis.vd
      FAULT_PATH: ''
    volumes:
    - type: bind
      source: /home/tanya/Documents/MANTA
      target: /odyssey
    command:
    - /bin/bash
    - -lc
    - 'source /opt/ros/jazzy/setup.bash

      source /odyssey/ros_ws/install/setup.bash

      ros2 run odyssey_sim odyssey_node'
  odyssey_2:
    image: odyssey_sim_dev
    environment:
      ROS_DOMAIN_ID: '1'
      ODYSSEY_VEHICLE_ID: odyssey_2
      ODYSSEY_DATA_DIR: /odyssey/output/Data
      ROS_LOG_DIR: /odyssey/output/Logs
      SIM_LOG_PATH: /odyssey/output/Logs/odyssey_2.log
      MISSION_PATH: /odyssey/generated/missions/picket_line_odyssey_2.mi
      VEHICLE_PATH: /odyssey/config/vehicles/Borealis.vd
      FAULT_PATH: ''
    volumes:
    - type: bind
      source: /home/tanya/Documents/MANTA
      target: /odyssey
    command:
    - /bin/bash
    - -lc
    - 'source /opt/ros/jazzy/setup.bash

      source /odyssey/ros_ws/install/setup.bash

      ros2 run odyssey_sim odyssey_node'
  whale_sim:
    image: odyssey_sim_dev
    environment:
      ROS_DOMAIN_ID: '1'
      ROS_LOG_DIR: /odyssey/output/Logs
    volumes:
    - type: bind
      source: /home/tanya/Documents/MANTA
      target: /odyssey
    command:
    - /bin/bash
    - -lc
    - 'source /opt/ros/jazzy/setup.bash

      source /odyssey/ros_ws/install/setup.bash

      ros2 run whale_sim whale_node --ros-args -p "count:=46" -p "line_start_north:=0.0"
      -p "line_start_east:=-63000.0" -p "line_end_north:=0.0" -p "line_end_east:=63000.0"
      -p "speed_min:=1.5" -p "speed_max:=1.5" -p "start_distance:=11000.0" -p "depth:=20.0"'
  sim_orchestrator:
    image: odyssey_sim_dev
    environment:
      ROS_DOMAIN_ID: '1'
      ROS_LOG_DIR: /odyssey/output/Logs
      SIM_LOG_PATH: /odyssey/output/Logs/sim_orchestrator.log
    volumes:
    - type: bind
      source: /home/tanya/Documents/MANTA
      target: /odyssey
    command:
    - /bin/bash
    - -lc
    - 'source /opt/ros/jazzy/setup.bash

      source /odyssey/ros_ws/install/setup.bash

      ros2 run sim_orchestrator sim_orchestrator_node --ros-args -p "vehicle_ids:=[odyssey_1,
      odyssey_2]" -p "timestep:=0.02" -p "control_period:=10" -p "max_cycles:=8640000"
      -p "steps_per_message:=10000"'
