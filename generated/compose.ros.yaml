name: manta
services:
  auv_1:
    image: odyssey_sim_dev
    environment:
      ROS_DOMAIN_ID: '1'
      ODYSSEY_VEHICLE_ID: auv_1
      ODYSSEY_DATA_DIR: /odyssey/output/trailing/Data
      ROS_LOG_DIR: /odyssey/output/trailing/Logs
      SIM_LOG_PATH: /odyssey/output/trailing/Logs/auv_1.log
      MISSION_PATH: /odyssey/generated/missions/trailing/auv_1.mi
      VEHICLE_PATH: /odyssey/config/vehicles/Borealis.vd
      FAULT_PATH: ''
    volumes:
    - type: bind
      source: /home/tanya/Documents/MANTA
      target: /odyssey
    command:
    - /bin/bash
    - -lc
    - 'source /opt/ros/jazzy/setup.bash

      source /odyssey/ros_ws/install/setup.bash

      ros2 run odyssey_sim odyssey_node --ros-args -p output_sample_period:=5.0 -p
      tracking_enabled:=true'
  whale_sim:
    image: odyssey_sim_dev
    environment:
      ROS_DOMAIN_ID: '1'
      ROS_LOG_DIR: /odyssey/output/trailing/Logs
    volumes:
    - type: bind
      source: /home/tanya/Documents/MANTA
      target: /odyssey
    command:
    - /bin/bash
    - -lc
    - 'source /opt/ros/jazzy/setup.bash

      source /odyssey/ros_ws/install/setup.bash

      exec ros2 run whale_sim whale_node --ros-args -p "count:=46" -p "line_start_north:=0.0"
      -p "line_start_east:=-63000.0" -p "line_end_north:=0.0" -p "line_end_east:=63000.0"
      -p "start_distance:=25000.0" -p "depth:=20.0" -p "mission_duration:=259200.0"
      -p "bout_mean_duration:=1842.0" -p "bout_mean_silent_duration:=7860.0" -p "bout_active_call_rate_per_hour:=40.1"
      -p "turn_interval:=60.0" -p "heading_correlation:=0.95" -p "heading_std_degrees:=15.0"
      -p "group_mean_size:=3.0" -p "group_position_std:=1000.0" -p "group_start_time_std:=600.0"
      -p "shared_heading_fraction:=0.75" -p "data_directory:=/odyssey/output/trailing/Data"
      -p "random_seed:=42" -p "sample_period:=60.0"'
    stop_grace_period: 5s
  whale_detection_sim:
    image: odyssey_sim_dev
    environment:
      ROS_DOMAIN_ID: '1'
      ROS_LOG_DIR: /odyssey/output/trailing/Logs
    volumes:
    - type: bind
      source: /home/tanya/Documents/MANTA
      target: /odyssey
    command:
    - /bin/bash
    - -lc
    - 'source /opt/ros/jazzy/setup.bash

      source /odyssey/ros_ws/install/setup.bash

      ros2 run whale_detection_sim whale_detection_node --ros-args -p "vehicle_ids:=[auv_1]"
      -p "detection_range:=11000.0" -p "data_directory:=/odyssey/output/trailing/Data"'
  sim_orchestrator:
    image: odyssey_sim_dev
    environment:
      ROS_DOMAIN_ID: '1'
      ROS_LOG_DIR: /odyssey/output/trailing/Logs
      SIM_LOG_PATH: /odyssey/output/trailing/Logs/sim_orchestrator.log
    volumes:
    - type: bind
      source: /home/tanya/Documents/MANTA
      target: /odyssey
    command:
    - /bin/bash
    - -lc
    - 'source /opt/ros/jazzy/setup.bash

      source /odyssey/ros_ws/install/setup.bash

      ros2 run sim_orchestrator sim_orchestrator_node --ros-args -p "vehicle_ids:=[auv_1]"
      -p "data_directory:=/odyssey/output/trailing/Data" -p "timestep:=0.02" -p "control_period:=10"
      -p "max_steps:=12960000" -p "steps_per_message:=10000"'
