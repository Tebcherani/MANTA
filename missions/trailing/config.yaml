#--------------------------------------------------
# Verion
#--------------------------------------------------
version: 1


#--------------------------------------------------
# Mission generation
#--------------------------------------------------
mission_generation:
  generator: missions/trailing/scripts/trailing_mission.py
  output_directory: ./output/trailing/missions

review:
  tracks: missions/trailing/review/plot_tracks.py
  sweep_comms: missions/trailing/review/plot_sweep_comms_freq.py

#--------------------------------------------------
# Output directories
#--------------------------------------------------
output:
  data_directory: ./output/trailing/Data
  log_directory: ./output/trailing/Logs
  auv_sample_period_s: 5.0    # Sample AUV's state every X simulated seconds


#--------------------------------------------------
# Simulation parameters
#--------------------------------------------------
simulation:
  max_steps: 4320000
  steps_per_message: 10000


#--------------------------------------------------
# Analysis
#--------------------------------------------------
monte_carlo:
  min_realizations: 50
  max_realizations: 200
  batch_size: 25
  workers: 8

  realization_timeout: 60
  max_retries: 1
  recovery_cycles: 3

  confidence_level: 0.95
  target_half_width: 500
  stability_tolerance: 500
  random_seed: 42

sweep:
  communication_intervals:
    - 0.0
    - 60.0
    - 300.0 # 5 min
    - 600.0 # 10 min
    - 900.0 # 15 min
    - 3000.0  # 30 min


#--------------------------------------------------
# Mission
#--------------------------------------------------
scenario:
  type: trailing

  trailing:
    vehicle_separation_m: 2000.0
    following_distance_m: 1000.0
    communication_interval_s: 500.0 # simulated seconds; 0 means immediate

  duration: 86400.0  # 1 day

  patrol:
    speed: 1.5
    depth: 50.0
    capture: 1000.0


#--------------------------------------------------
# Vehicles
#--------------------------------------------------
vehicles:
  - id: auv_1
    type: odyssey
    mission: ./output/trailing/missions/auv_1.mi
    model: ./components/manta_odyssey/config/Borealis.vd
    fault: ""
    start:
      north: -1000.0
      east: -1000.0

  - id: auv_2
    type: odyssey
    mission: ./output/trailing/missions/auv_2.mi
    model: ./components/manta_odyssey/config/Borealis.vd
    fault: ""
    start:
      north: -1000.0
      east: 1000.0