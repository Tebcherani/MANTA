#--------------------------------------------------
# Verion
#--------------------------------------------------
version: 1


#--------------------------------------------------
# Mission generation
#--------------------------------------------------
mission_generation:
  generator: missions/picket_line/scripts/picket_line_mission.py
  output_directory: ./output/picket_line/missions

review:
  tracks: missions/picket_line/review/plot_tracks.py
  sweep: missions/picket_line/review/plot_sweep_fleet_size.py


#--------------------------------------------------
# Output directories
#--------------------------------------------------
output:
  data_directory: ./output/picket_line/Data
  log_directory: ./output/picket_line/Logs
  auv_sample_period_s: 5.0    # Sample AUV's state every X simulated seconds


#--------------------------------------------------
# Simulation parameters
#--------------------------------------------------
simulation:
  max_steps: 12960000 
  steps_per_message: 10000


#--------------------------------------------------
# Analysis
#--------------------------------------------------
monte_carlo:
  min_realizations: 100
  max_realizations: 500
  batch_size: 25
  workers: 8

  realization_timeout: 60
  max_retries: 1
  recovery_cycles: 3

  confidence_level: 0.95
  target_half_width: 0.03
  stability_tolerance: 0.01
  random_seed: 42

sweep:
  min_vehicles: 1
  max_vehicles: 13


#--------------------------------------------------
# Mission
#--------------------------------------------------
scenario:
  type: picket_line

  duration: 259200.0  # 3 days

  picket_line:
    start:
      north: 0.0
      east: -63000.0
    end:
      north: 0.0
      east: 63000.0

  patrol:
    speed: 0.25
    depth: 50.0
    capture: 5.0


#--------------------------------------------------
# Vehicles
#--------------------------------------------------
vehicles:
  - id: auv_1
    type: odyssey
    mission: ./output/picket_line/missions/auv_1.mi
    model: ./components/manta_odyssey/config/Borealis.vd
    fault: ""